<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Stoat's Tonic carnival broadside</title>
  <desc id="desc">A vintage hand-printed advertisement showing a bespectacled stoat in a waistcoat presenting a bottle of tonic.</desc>
  <defs>
    <pattern id="paper-flecks" width="73" height="61" patternUnits="userSpaceOnUse">
      <path d="M8 13l19-2M45 49l14 1M36 26l7-1" fill="none" stroke="#8d7048" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
      <circle cx="61" cy="17" r="1.2" fill="#8d7048" opacity=".2"/>
      <circle cx="19" cy="43" r=".9" fill="#8d7048" opacity=".18"/>
    </pattern>
    <filter id="ink-wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <path d="M22 20L613 15 622 238 615 471 624 941 430 947 235 940 23 948 16 716 23 482 15 197Z" fill="#e7d39b" stroke="#292832" stroke-width="12"/>
  <path d="M33 34Q193 26 320 31T605 29L608 925Q460 917 321 925T37 921Z" fill="none" stroke="#397066" stroke-width="5"/>
  <path d="M31 32H609V928H31Z" fill="url(#paper-flecks)"/>

  <g fill="none" stroke="#973b37" stroke-width="7" stroke-linecap="round" filter="url(#ink-wobble)">
    <path d="M55 57Q174 77 319 57T585 58"/>
    <path d="M56 82Q89 91 101 125M584 83Q551 92 540 126"/>
    <path d="M54 915Q180 899 319 916T587 915"/>
    <path d="M56 875Q90 865 101 831M584 875Q551 865 540 832"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" filter="url(#ink-wobble)">
    <text x="320" y="122" fill="#963a36" font-size="66" font-weight="900" letter-spacing="1">DR. STOAT'S</text>
    <text x="320" y="204" fill="#292832" font-size="94" font-weight="900" letter-spacing="8">TONIC</text>
    <path d="M82 226Q318 240 558 224" fill="none" stroke="#397066" stroke-width="7"/>
    <text x="320" y="257" fill="#397066" font-size="20" font-weight="700" letter-spacing="4">AN EXHILARATING ELIXIR</text>
  </g>

  <!-- radiating salesmanship behind the bottle -->
  <g fill="none" stroke="#b78c42" stroke-width="5" stroke-linecap="round" opacity=".88">
    <path d="M472 321l4-36M527 340l24-28M553 388l36-8M545 442l32 17M423 321l-10-31"/>
  </g>
  <g fill="#b78c42" stroke="#292832" stroke-width="3">
    <path d="M569 302l5 12 14 2-11 10 3 14-13-7-12 7 3-14-11-10 14-2Z"/>
    <path d="M90 315l4 10 11 2-9 8 3 11-10-6-10 6 3-11-9-8 11-2Z"/>
  </g>

  <!-- Dr. Stoat -->
  <g stroke="#292832" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink-wobble)">
    <!-- tail and body -->
    <path d="M200 612Q126 653 105 611 94 586 123 566 98 600 132 601 160 602 188 574" fill="none" stroke="#292832" stroke-width="15"/>
    <path d="M154 705Q151 593 184 509 204 457 256 449 313 443 347 489 382 536 377 704Z" fill="#c18d62" stroke-width="10"/>
    <!-- shirt and waistcoat -->
    <path d="M206 485Q253 515 303 482L331 704 186 704Z" fill="#f0dfb0" stroke-width="8"/>
    <path d="M185 502Q207 523 245 539L230 704H171Q164 593 185 502Z" fill="#713844" stroke-width="8"/>
    <path d="M306 498Q287 523 254 539L276 704H341Q353 581 306 498Z" fill="#713844" stroke-width="8"/>
    <path d="M245 537l10 32 14-33-14-15Z" fill="#397066" stroke-width="5"/>
    <circle cx="269" cy="584" r="5" fill="#d5ad55" stroke-width="3"/>
    <circle cx="272" cy="629" r="5" fill="#d5ad55" stroke-width="3"/>
    <path d="M189 705h173" fill="none" stroke-width="10"/>

    <!-- long stoat neck and head -->
    <path d="M210 494Q192 448 195 388 198 320 237 291 268 267 306 282 346 298 356 341 366 384 338 426 318 456 305 500 256 527 210 494Z" fill="#c99568" stroke-width="10"/>
    <!-- ears -->
    <path d="M217 323L181 273Q229 265 247 299" fill="#c99568" stroke-width="9"/>
    <path d="M303 294l24-31q32 27 13 59" fill="#c99568" stroke-width="9"/>
