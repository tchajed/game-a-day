    <!-- pale stoat markings -->
    <path d="M211 360Q238 321 269 347 303 316 339 352L331 413Q300 455 257 456 217 452 201 416Z" fill="#f2e3b7" stroke-width="7"/>
    <!-- spectacles -->
    <circle cx="241" cy="374" r="29" fill="none" stroke="#397066" stroke-width="8"/>
    <circle cx="306" cy="372" r="29" fill="none" stroke="#397066" stroke-width="8"/>
    <path d="M270 371q6-8 12 0M212 364l-27-11M335 361l22-11" fill="none" stroke="#397066" stroke-width="7"/>
    <circle cx="246" cy="378" r="7" fill="#292832" stroke="none"/>
    <circle cx="301" cy="376" r="7" fill="#292832" stroke="none"/>
    <path d="M258 404l16 12 15-13-15-10Z" fill="#963a36" stroke-width="5"/>
    <path d="M274 417q-5 24 24 23" fill="none" stroke-width="5"/>
    <path d="M224 423l-47 7M226 435l-43 19M318 420l40 4M317 434l38 16" fill="none" stroke="#6d533c" stroke-width="3"/>

    <!-- presenting arm -->
    <path d="M315 525Q360 489 412 516L420 572Q371 574 329 557Z" fill="#c99568" stroke-width="9"/>
    <path d="M397 514q33-8 49 14l-12 44-20 1Z" fill="#f0dfb0" stroke-width="8"/>

    <!-- tonic bottle -->
    <path d="M430 386L440 351H492L501 386V474L526 503 519 686Q474 718 424 687L418 503 440 474V386Z" fill="#397c71" stroke-width="10"/>
    <path d="M440 351l5-35h41l6 35Z" fill="#963a36" stroke-width="9"/>
    <path d="M443 319h42" fill="none" stroke="#292832" stroke-width="12"/>
    <path d="M432 539Q471 517 513 539L511 647Q470 672 428 647Z" fill="#eedb9f" stroke-width="8"/>
    <path d="M449 566h44M449 620h44" fill="none" stroke="#963a36" stroke-width="4"/>
    <text x="471" y="590" text-anchor="middle" fill="#292832" stroke="none" font-family="Georgia,serif" font-size="20" font-weight="900">DR. S</text>
    <text x="471" y="614" text-anchor="middle" fill="#397066" stroke="none" font-family="Georgia,serif" font-size="15" font-weight="900" letter-spacing="1">TONIC</text>
    <path d="M448 486q23 12 47 0" fill="none" stroke="#8fc0a3" stroke-width="4" opacity=".7"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#397066" stroke-width="5">
    <circle cx="551" cy="527" r="11"/><circle cx="563" cy="484" r="6"/><circle cx="92" cy="489" r="10"/>
    <circle cx="112" cy="534" r="5"/>
  </g>

  <!-- promise banner -->
  <g filter="url(#ink-wobble)">
    <path d="M73 746Q321 731 568 747L550 833Q321 846 89 832Z" fill="#963a36" stroke="#292832" stroke-width="8" stroke-linejoin="round"/>
    <path d="M91 758Q321 747 550 759L540 818Q321 829 100 817Z" fill="#f0dfa9" stroke="#d1aa52" stroke-width="4"/>
    <text x="320" y="785" text-anchor="middle" fill="#292832" font-family="Georgia,serif" font-size="26" font-weight="900" letter-spacing="3">CONFIDENCE</text>
    <text x="320" y="813" text-anchor="middle" fill="#397066" font-family="Georgia,serif" font-size="18" font-weight="700" letter-spacing="3">VIGOROUSLY BOTTLED</text>
  </g>

  <text x="320" y="870" text-anchor="middle" fill="#292832" font-family="Georgia,serif" font-size="19" font-weight="700" letter-spacing="2">RESULTS MAY FEEL IMMEDIATE</text>
  <text x="320" y="897" text-anchor="middle" fill="#397066" font-family="Georgia,serif" font-size="18" font-style="italic">No specific claims available</text>
</svg>
