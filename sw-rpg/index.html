<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#152538" />
    <meta name="description" content="Route 404: a tiny software-development RPG." />
    <title>Route 404</title>
  </head>
  <body>
    <main id="app" aria-label="Route 404 game"></main>
    <button id="music-toggle" type="button" aria-pressed="true" aria-label="Toggle music">♫ MUSIC ON</button>
    <section id="touch-controls" aria-label="Movement controls">
      <button data-dir="up" aria-label="Move up">▲</button>
      <button data-dir="left" aria-label="Move left">◀</button>
      <button data-dir="down" aria-label="Move down">▼</button>
      <button data-dir="right" aria-label="Move right">▶</button>
    </section>
    <div id="game-status" class="sr-only" role="status" aria-live="polite">Loading Route 404</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
