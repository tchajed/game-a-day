<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 360" role="img" aria-labelledby="title desc">
  <title id="title">Maribel Voss, onboarding facilitator</title>
  <desc id="desc">A round, relentlessly cheerful human facilitator with a plum updo, orange coat, overstuffed clipboard, and welcoming hand.</desc>
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f18d4e"/><stop offset=".55" stop-color="#b84d40"/><stop offset="1" stop-color="#71313b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dc875e"/><stop offset="1" stop-color="#8e413f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#583047"/><stop offset=".5" stop-color="#2d1b2d"/><stop offset="1" stop-color="#17121d"/>
    </linearGradient>
  </defs>

  <!-- practical legs -->
  <path d="m71 257 34-3 2 86-38 2Z" fill="#2e2230" stroke="#161018" stroke-width="5"/>
  <path d="m111 254 35 1 12 86-40 1Z" fill="#3e2937" stroke="#161018" stroke-width="5"/>
  <path d="m65 335 43-1 7 15H54Z" fill="#171218"/>
  <path d="m117 335 42-1 15 15h-57Z" fill="#171218"/>

  <!-- broad dark outfit -->
  <path d="M73 143q35-20 74 2l17 113-102 2Z" fill="#241923" stroke="#21141c" stroke-width="5"/>
  <path d="m84 151 26 32 29-34 8 103H70Z" fill="#382335"/>

  <!-- flowing orange onboarding coat -->
  <path d="M69 138 37 164l13 101 28-2 13-91 19 17 23-20 15 94 30-3 8-98-39-25-30 42Z" fill="url(#coat)" stroke="#25151d" stroke-width="6" stroke-linejoin="round"/>
  <path d="m69 138 40 45-24 19-26-52Z" fill="#f0a153" stroke="#9a483d" stroke-width="3"/>
  <path d="m147 137-37 46 23 18 27-50Z" fill="#f6ad5a" stroke="#9a483d" stroke-width="3"/>
  <path d="M48 184 39 262l29 3 9-75M177 181l9 79-27 4-10-74" fill="none" stroke="#ef8a4b" stroke-opacity=".65" stroke-width="3"/>

  <!-- comically overstuffed clipboard -->
  <g transform="translate(24 178) rotate(-7)">
    <path d="M0 5h55v93H0Z" fill="#211721" stroke="#130e14" stroke-width="5"/>
    <path d="M7 1h40v85H7Z" fill="#e4c07f" stroke="#4c3033" stroke-width="3"/>
    <path d="M14-7h25V7H14Z" fill="#663442" stroke="#261820" stroke-width="3"/>
    <path d="M4 7v-14h8V7M20 5v-21h8V5M35 6v-12h8V6M46 11V-3h7v14" fill="#d26c54"/>
    <path d="M14 26h25M14 39h20M14 52h27M14 65h18" stroke="#8d6b58" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="m70 218-18 27" stroke="#b65747" stroke-width="16" stroke-linecap="round"/>
  <path d="m55 241-12 3" stroke="#d98360" stroke-width="10" stroke-linecap="round"/>

  <!-- open welcoming arm and hand -->
  <path d="m168 176 13 45 18-11" fill="none" stroke="#b65345" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m197 210 13-10M198 211l16-2M198 213l14 7" fill="none" stroke="#d88762" stroke-width="7" stroke-linecap="round"/>
  <circle cx="196" cy="211" r="8" fill="#d88762"/>

  <!-- neck and softly rounded friendly head -->
  <path d="M94 146q4-24 3-34h36q-1 12 5 34Z" fill="#a64d43"/>
  <ellipse cx="116" cy="86" rx="54" ry="58" fill="url(#skin)" stroke="#281720" stroke-width="5"/>
  <ellipse cx="65" cy="91" rx="8" ry="14" fill="#b85e4d"/>
  <ellipse cx="168" cy="91" rx="8" ry="14" fill="#99463f"/>
  <circle cx="88" cy="102" r="10" fill="#e79a72" opacity=".2"/>
  <circle cx="148" cy="101" r="10" fill="#e79a72" opacity=".18"/>

  <!-- selected B hair: soft forelock, loose bun, curls -->
  <path d="M62 78q-7-43 27-62 39-23 72 8 24 1 29 23 6 24-18 38l-15-18q-1-21-18-32-24 23-61 28l1 40q-13 5-18-5Z" fill="url(#hair)"/>
  <circle cx="166" cy="42" r="29" fill="#3b2234" stroke="#281724" stroke-width="4"/>
  <circle cx="185" cy="47" r="17" fill="#49283c"/>
  <circle cx="163" cy="24" r="17" fill="#4c2a40"/>
  <path d="M76 60C82 23 113 4 145 20c-3 24-20 41-45 46-11 2-19 0-24-6Z" fill="#4c2a40"/>
  <path d="M78 53q24-31 59-29" fill="none" stroke="#75405a" stroke-width="4" stroke-linecap="round"/>
  <path d="M169 73q20 15 3 34 15 13-2 29" fill="none" stroke="#4d293d" stroke-width="8" stroke-linecap="round"/>

  <!-- soft, open, readable face -->
  <path d="M81 72q13-9 27 1M129 71q12-8 24 2" fill="none" stroke="#34202a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="98" cy="83" rx="10" ry="7.5" fill="#f3d39a" stroke="#47262d" stroke-width="2"/>
  <ellipse cx="140" cy="82" rx="10" ry="7.5" fill="#f3d39a" stroke="#47262d" stroke-width="2"/>
  <circle cx="100" cy="83" r="4.5" fill="#c97837"/>
  <circle cx="138" cy="82" r="4.5" fill="#c97837"/>
  <circle cx="101" cy="84" r="2.3" fill="#261820"/>
  <circle cx="137" cy="83" r="2.3" fill="#261820"/>
  <circle cx="102" cy="81.5" r="1.2" fill="#ffe1a6"/>
  <circle cx="139" cy="80.5" r="1.2" fill="#ffe1a6"/>
  <path d="M117 84q-6 14-2 18 5 3 11-1" fill="none" stroke="#91433e" stroke-width="3" stroke-linecap="round"/>
  <path d="M87 108q29 35 62-3-30 17-62 3Z" fill="#682c36" stroke="#4d232c" stroke-width="2"/>
  <path d="M96 111q22 13 43-2" fill="none" stroke="#f4d5a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M103 125q15 7 27-1" fill="none" stroke="#ba5d5a" stroke-width="3" stroke-linecap="round"/>

  <!-- small bureaucratic badge -->
  <g transform="translate(139 167) rotate(4)">
    <path d="M0 0h27v22H2Z" fill="#e8b55e" stroke="#6c3836" stroke-width="2"/>
    <path d="m8 7 5-3 6 4-5 7Z" fill="#5b3135"/>
  </g>
</svg>
