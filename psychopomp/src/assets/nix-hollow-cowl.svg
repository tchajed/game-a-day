<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 500" role="img" aria-labelledby="title desc">
  <title id="title">Nix, the hollow-cowl psychopomp</title>
  <desc id="desc">An unnaturally tall black-robed figure with a pointed empty cowl, a tiny awkward amber face, folded arms, and an L6 badge.</desc>
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24232b"/>
      <stop offset="0.38" stop-color="#090a0f"/>
      <stop offset="0.72" stop-color="#16151c"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.5" stop-color="#2b2831"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8f5744" stop-opacity=".75"/>
      <stop offset=".22" stop-color="#34303a"/>
      <stop offset=".8" stop-color="#17171d"/>
      <stop offset="1" stop-color="#a26047" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="void" cx="48%" cy="45%" r="60%">
      <stop offset="0" stop-color="#020205"/>
      <stop offset=".72" stop-color="#05050a"/>
      <stop offset="1" stop-color="#111117"/>
    </radialGradient>
    <filter id="faceGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- split hem and impossibly long legs -->
  <path d="M59 285 88 278 89 490 52 492Z" fill="#090a0f" stroke="#050509" stroke-width="4"/>
  <path d="m90 278 33 8 12 205-43-1Z" fill="#111117" stroke="#050509" stroke-width="4"/>
  <path d="m51 489 38-5-4 12-47 1Z" fill="#08090d"/>
  <path d="m92 484 42 5 10 8H94Z" fill="#0b0c11"/>
  <path d="M70 302 82 486" fill="none" stroke="#302a33" stroke-opacity=".7" stroke-width="2"/>
  <path d="M111 303 101 486" fill="none" stroke="#352c35" stroke-opacity=".55" stroke-width="2"/>

  <!-- long spare body -->
  <path d="M38 174 61 145h61l24 32-15 189-40 37-43-36Z" fill="url(#robe)" stroke="#07070b" stroke-width="5" stroke-linejoin="round"/>
  <path d="m61 145 29 32 32-32 9 221-40 37Z" fill="url(#fold)" opacity=".8"/>
  <path d="m38 174 52 3-42 190Z" fill="#090a0e" opacity=".92"/>
  <path d="m146 177-56 0 41 189Z" fill="#15141b" opacity=".85"/>
  <path d="m90 177-5 211" fill="none" stroke="#36313a" stroke-opacity=".46" stroke-width="2"/>
  <path d="m57 150 32 27 34-27" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- long sleeves folded with severe patience -->
  <path d="M42 179 23 265l26 45 54-30-10-28-43 20 13-77Z" fill="#111118" stroke="#07070b" stroke-width="5" stroke-linejoin="round"/>
  <path d="m137 180 18 80-27 49-71-27 8-27 59 18-10-77Z" fill="#18171e" stroke="#07070b" stroke-width="5" stroke-linejoin="round"/>
  <path d="m35 244 22 38 46-2" fill="none" stroke="#3b333d" stroke-opacity=".64" stroke-width="3"/>
  <path d="m144 240-16 69-71-27" fill="none" stroke="#342e38" stroke-opacity=".65" stroke-width="3"/>
  <path d="m57 282 39-3 12 8-11 10-44-4Z" fill="#242029" stroke="#09090d" stroke-width="3"/>
  <path d="m103 280 26 1-5 14-30 2 14-10Z" fill="#15141a" stroke="#09090d" stroke-width="3"/>

  <!-- architectural hollow cowl -->
  <path d="M54 151 43 79 91 5l9 54 42 61-21 52-61-5Z" fill="url(#robe)" stroke="#06070a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M51 81 91 5 74 95Z" fill="#17171e"/>
  <path d="m91 5 9 54 30 44-35-23Z" fill="#08090e"/>
  <path d="M58 101 91 58l39 54-18 43-43-2-17-31Z" fill="url(#void)" stroke="#292630" stroke-width="4" stroke-linejoin="round"/>
  <path d="m55 146 14 7 43 2 18-18" fill="none" stroke="#3d3540" stroke-width="3" stroke-linecap="round"/>
  <path d="m58 157 17 16h36l13-15" fill="none" stroke="#17171d" stroke-width="8"/>
  <path d="m47 81 11 70" fill="none" stroke="#a15d44" stroke-opacity=".55" stroke-width="2"/>
  <path d="m140 118-19 49" fill="none" stroke="#9d5944" stroke-opacity=".45" stroke-width="2"/>

  <!-- awkward :/ face, floating in the void -->
  <g fill="#e8a052" stroke="#f6c279" stroke-width=".8" filter="url(#faceGlow)">
    <circle cx="80" cy="111" r="2.7"/>
    <circle cx="101" cy="114" r="2.7"/>
    <path d="m87 130 12-5" fill="none" stroke-linecap="round" stroke-width="3"/>
  </g>

  <!-- one bureaucratic interruption -->
  <g transform="translate(116 185) rotate(5)">
    <path d="M2 0h18l3 5-4 25H4L0 5Z" fill="#b8733f" stroke="#e3a45e" stroke-width="2"/>
    <path d="M6 7h11" stroke="#3b2423" stroke-width="2"/>
    <text x="4.2" y="22" fill="#21141a" font-family="monospace" font-size="10" font-weight="700">L6</text>
  </g>
</svg>
